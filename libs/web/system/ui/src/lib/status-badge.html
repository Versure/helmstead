@let shown = view();
<div class="badge" role="status" aria-live="polite">
  <span
    class="pill"
    [class]="'pill pill--' + shown.tone"
    [attr.title]="shown.title"
  >
    <span class="dot" aria-hidden="true"></span>
    {{ shown.label }}
  </span>
  @if (shown.tone === 'danger') {
  <button class="button" type="button" (click)="retry.emit()">Retry</button>
  }
</div>
